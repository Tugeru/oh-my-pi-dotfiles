providers:
  kie:
    authHeader: true
    apiKey: "!jq -r '.kie.key' $HOME/.omp/agent/auth.json"
    baseUrl: https://api.kie.ai/codex/v1
    models:
      - id: gpt-5-6-sol
        name: GPT-5.6 Sol (Kie.ai)
        api: openai-responses
        baseUrl: https://api.kie.ai/codex/v1
        reasoning: true
        input: [text, image]
        cost: { input: 5, output: 30, cacheRead: 0.5, cacheWrite: 6.25 }
        compat:
          supportsDeveloperRole: false
        contextWindow: 1050000
        maxTokens: 128000
        thinking:
          mode: effort
          efforts: [low, medium, high, xhigh, max]
      - id: gpt-5-6-terra
        name: GPT-5.6 Terra (Kie.ai)
